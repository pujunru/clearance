name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build and test
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec apps/macos/project.yml --project apps/macos

      - name: Build and test
        run: |
          xcodebuild test \
            -project apps/macos/Clearance.xcodeproj \
            -scheme Clearance \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/ClearanceDerivedData" \
            CODE_SIGNING_ALLOWED=NO
